<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1c1b18" />
    <title>Corridor</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map" class="map-root"></div>
    <header class="ui-chrome chrome">
      <div class="brand">
        <h1>Corridor</h1>
        <p>South of Chambers</p>
      </div>
      <div class="chrome-actions">
        <button id="btn-review" class="ghost-btn primary-btn" type="button" hidden>Select stops</button>
        <button id="btn-plan" class="ghost-btn primary-btn" type="button" hidden>Plan route</button>
        <button id="btn-clear" class="ghost-btn" type="button" hidden>Clear</button>
      </div>
    </header>
    <div id="hint" class="hint ui-chrome">
      <strong id="hint-title">Tap the map</strong>
      <span id="hint-body">First tap is start. Second tap is end. Then pull the line through the blocks you want.</span>
    </div>
    <div id="toast" class="toast ui-chrome" hidden></div>
    <section id="sheet" class="sheet ui-chrome" hidden>
      <div class="sheet-meta">
        <span id="sheet-count">1 of 1</span>
        <span id="sheet-yes">0 extra stops</span>
      </div>
      <h2 id="place-name"></h2>
      <div id="place-bucket" class="bucket"></div>
      <p id="place-liner" class="liner"></p>
      <a id="place-link" class="ao-link" target="_blank" rel="noopener">Read on Atlas Obscura</a>
      <div class="actions">
        <button id="btn-no" class="btn secondary" type="button">No</button>
        <button id="btn-yes" class="btn" type="button">Yes — stop here</button>
      </div>
      <div class="undo-row">
        <button id="btn-undo" type="button" hidden>Undo last No</button>
        <button id="btn-plan-sheet" type="button">Plan route</button>
      </div>
    </section>
    <section id="summary" class="summary ui-chrome" hidden>
      <h2>Your walk</h2>
      <div id="summary-body"></div>
    </section>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
